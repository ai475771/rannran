const P=10,Q=[];S.forEach(s=>s.d.forEach(r=>{const a=r.split("|"),k=a.pop(),q=a.shift();Q.push({s:s.n,t:s.t,q,o:s.t=="b"?["Benar","Salah"]:a,k})}));
const ans=Q.map(()=>[]);let pg=0,done=false,flt="all";const $=id=>document.getElementById(id),L="ABCDE",pages=Math.ceil(Q.length/P);
const ok=i=>[...ans[i]].sort().join("")===Q[i].k.split("").sort().join("");
function upd(){const n=ans.filter(a=>a.length).length;$("pb").style.width=(done?100:n/Q.length*100)+"%";$("sub").textContent=done?"Hasil kuis":`${Q.length} soal · terjawab ${n} · halaman ${pg+1}/${pages}`}
function opts(i,rev){const q=Q[i],m=q.t=="m";return q.o.map((o,j)=>{const c=L[j],on=ans[i].includes(c),cor=q.k.includes(c);let cl=on?"on":"";if(rev)cl=cor?"ok":on?"bad":"";return `<label class="${cl}"><input type="${m?"checkbox":"radio"}" name="q${i}" ${on?"checked":""} ${rev?"disabled":""} onchange="pick(${i},'${c}',this.checked)"><span><b>${c}.</b> ${o}</span></label>`}).join("")}
function pick(i,c,v){const q=Q[i];ans[i]=q.t=="m"?(v?[...ans[i],c]:ans[i].filter(x=>x!=c)):[c];show()}
function show(){upd();let h="";const a=pg*P,b=Math.min(a+P,Q.length);for(let i=a;i<b;i++){const q=Q[i];h+=`<div class="card"><div class="sec">${q.s}</div><div class="q">${i+1}. ${q.q}</div>${q.t=="m"?'<div class="sub">Pilih semua jawaban yang benar.</div>':""}${opts(i)}</div>`}
const last=pg==pages-1;h+=`<div class="nav"><button class="g" ${pg?"":"disabled"} onclick="go(-1)">← Sebelumnya</button>${last?'<button onclick="fin()">Kirim Jawaban</button>':'<button onclick="go(1)">Berikutnya →</button>'}</div>`;if(last){const u=ans.filter(a=>!a.length).length;if(u)h+=`<div class="warn">${u} soal belum dijawab.</div>`}$("app").innerHTML=h}
function go(d){pg+=d;show();scrollTo(0,0)}
function fin(){const u=ans.filter(a=>!a.length).length;if(u&&!confirm(u+" soal belum dijawab. Tetap kirim?"))return;done=true;res();scrollTo(0,0)}
function res(){upd();const n=Q.filter((_,i)=>ok(i)).length,pct=Math.round(n/Q.length*100);let h=`<div class="card"><div class="sc">${n} / ${Q.length} (${pct}%)</div><div>Benar: ${n} · Salah/kosong: ${Q.length-n}</div><div class="fl"><button class="${flt=="all"?"":"g"}" onclick="f('all')">Semua</button><button class="${flt=="no"?"":"g"}" onclick="f('no')">Salah</button><button class="${flt=="ok"?"":"g"}" onclick="f('ok')">Benar</button><button class="g" onclick="rs()">Ulangi Kuis</button></div></div>`;
Q.forEach((q,i)=>{const r=ok(i);if(flt=="ok"&&!r||flt=="no"&&r)return;h+=`<div class="card"><span class="tag ${r?"ok":"no"}">${r?"✓ Benar":ans[i].length?"✗ Salah":"✗ Tidak dijawab"}</span><div class="q">${i+1}. ${q.q}</div>${opts(i,1)}<div class="sub">Kunci jawaban: <b>${q.k.split("").join(", ")}</b> · Jawabanmu: <b>${ans[i].sort().join(", ")||"-"}</b></div></div>`});$("app").innerHTML=h}
function f(x){flt=x;res()}function rs(){ans.forEach((_,i)=>ans[i]=[]);pg=0;done=false;flt="all";show();scrollTo(0,0)}
show();
</script></body></html>
